name: Bale FFmpegInteropX wrapper

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Wrapper NuGet version (2.1.0-bale.N; use a new number for each release)
        type: string
        required: true
        default: 2.1.0-bale.23
      publish:
        description: Publish an immutable release (false builds and uploads artifacts only)
        type: boolean
        default: false

permissions:
  contents: read

# Never cancel a build in order to replace an immutable package at the same version.
concurrency:
  group: bale-wrapper-${{ github.event_name }}-${{ inputs.version || github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: Pins, syntax, fixtures and source guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: false
          sparse-checkout: |
            .github
            bale
            Source
            Build
          persist-credentials: false

      - name: Validate pins, test fixtures and guard HEAD
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
        run: |
          . ./bale/scripts/ffmpeginteropx-wrapper-common.ps1
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch' -and
              $env:PACKAGE_VERSION -cnotmatch '^2\.1\.0-bale\.(0|[1-9]\d*)$') { throw 'Expected version 2.1.0-bale.N' }
          $pin = Get-WrapperPin
          ./bale/scripts/test-ffmpeg-checks.ps1
          ./bale/scripts/test-ffmpeginteropx-wrapper.ps1
          Assert-WrapperSource . $pin.upstream_base

  wrapper:
    name: Build and repack UWP x64 wrapper
    if: github.event_name == 'workflow_dispatch'
    needs: checks
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      release_tag: ${{ steps.build.outputs.release_tag }}
      package_sha256: ${{ steps.build.outputs.package_sha256 }}
    steps:
      # Build this fork's checkout, without upstream Libs or submodule/source builds.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: false
          sparse-checkout: |
            .github
            bale
            Source
            Build
          persist-credentials: false

      - name: Refuse a previously released version in either repository
        if: inputs.publish
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
        run: |
          . ./bale/scripts/ffmpeginteropx-wrapper-common.ps1
          Assert-WrapperReleaseAvailable $env:GITHUB_REPOSITORY "wrapper-ffmpeginteropx-$env:PACKAGE_VERSION"

      - uses: microsoft/setup-msbuild@v3
      - uses: NuGet/setup-nuget@v2
        with:
          nuget-version: 6.14.0

      - name: Build and repack
        id: build
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
        run: ./bale/scripts/build-ffmpeginteropx-wrapper.ps1 -SourcePath . -Version $env:PACKAGE_VERSION

      - name: Preserve package, provenance and build diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ffmpeginteropx-wrapper-uwp-x64-${{ github.run_id }}
          path: Output/NuGet/
          if-no-files-found: warn

  publish:
    name: Publish immutable wrapper release
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: wrapper
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read # gh downloads the build artifact in this job.
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: false
          sparse-checkout: bale
          persist-credentials: false

      # Download with gh rather than adding another action dependency.
      - name: Publish the verified build assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.wrapper.outputs.release_tag }}
          PACKAGE_SHA256: ${{ needs.wrapper.outputs.package_sha256 }}
          ARTIFACT_NAME: ffmpeginteropx-wrapper-uwp-x64-${{ github.run_id }}
        run: |
          . ./bale/scripts/ffmpeginteropx-wrapper-common.ps1
          Assert-WrapperReleaseAvailable $env:GITHUB_REPOSITORY $env:RELEASE_TAG
          gh run download $env:GITHUB_RUN_ID --name $env:ARTIFACT_NAME --dir release-assets
          if ($LASTEXITCODE -ne 0) { throw 'Wrapper artifact download failed' }
          $packages = @(Get-ChildItem release-assets -File -Filter '*.nupkg')
          if ($packages.Count -ne 1 -or
              (Get-FileHash $packages[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:PACKAGE_SHA256) {
              throw 'Wrapper artifact SHA256 mismatch'
          }
          $notes = "UWP x64 native wrapper only; original 2.1.0 managed projection and winmd retained. Built from $env:GITHUB_REPOSITORY commit $env:GITHUB_SHA. See SOURCES.txt and winmd-public-types.txt. Package SHA256: $env:PACKAGE_SHA256."
          $assets = @(Get-ChildItem release-assets -File | ForEach-Object { $_.FullName })
          gh release create $env:RELEASE_TAG @assets --target $env:GITHUB_SHA `
            --title $env:RELEASE_TAG --notes $notes --latest=false
          if ($LASTEXITCODE -ne 0) { throw 'Wrapper release publication failed' }
